// ── Math spiral ──
function makeSpiral(cx,cy,turns,maxR,steps){var pts=[];for(var i=0;i<=steps;i++){var t=i/steps,a=t*turns*Math.PI*2-Math.PI/2,r=t*maxR;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return pts.map(function(p,i){return(i===0?'M':'L')+p[0].toFixed(2)+','+p[1].toFixed(2);}).join(' ');}
function spiralDashLen(turns,maxR,steps){var pts=[];for(var i=0;i<=steps;i++){var t=i/steps,a=t*turns*Math.PI*2,r=t*maxR;pts.push([Math.cos(a)*r,Math.sin(a)*r]);}var len=0;for(var i=1;i<pts.length;i++){var dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1];len+=Math.sqrt(dx*dx+dy*dy);}return Math.ceil(len)+20;}
var SP_CX=32,SP_CY=33,SP_TURNS=3.2,SP_R=26,SP_STEPS=180;
var SP_D1=makeSpiral(SP_CX,SP_CY,SP_TURNS,SP_R,SP_STEPS);
var SP_D2=makeSpiral(SP_CX,SP_CY,SP_TURNS,SP_R-0.8,SP_STEPS);
var SP_D3=makeSpiral(SP_CX,SP_CY,SP_TURNS,SP_R-1.4,SP_STEPS);
var SP_DASH=spiralDashLen(SP_TURNS,SP_R,SP_STEPS);

 fill="white"/><circle class="sd s9" cx="56" cy="56" r="0.5" fill="white"/></g></svg>';
var NETWORK_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64"><defs><style>.n1{stroke-dasharray:60;stroke-dashoffset:60;animation:nD 3.5s ease-in-out infinite}.n2{stroke-dasharray:40;stroke-dashoffset:40;animation:nD 3.5s 0.28s ease-in-out infinite}.n3{stroke-dasharray:40;stroke-dashoffset:40;animation:nD 3.5s 0.56s ease-in-out infinite}.n4{stroke-dasharray:40;stroke-dashoffset:40;animation:nD 3.5s 0.84s ease-in-out infinite}.n5{stroke-dasharray:40;stroke-dashoffset:40;animation:nD 3.5s 1.12s ease-in-out infinite}.n6{stroke-dasharray:25;stroke-dashoffset:25;animation:nD 3.5s 1.4s ease-in-out infinite;opacity:0.6}.n7{stroke-dasharray:25;stroke-dashoffset:25;animation:nD 3.5s 1.55s ease-in-out infinite;opacity:0.6}.n8{stroke-dasharray:25;stroke-dashoffset:25;animation:nD 3.5s 1.7s ease-in-out infinite;opacity:0.6}.n9{stroke-dasharray:25;stroke-dashoffset:25;animation:nD 3.5s 1.85s ease-in-out infinite;opacity:0.6}.nd{animation:ndF 3.5s ease-in-out infinite}@keyframes nD{0%{stroke-dashoffset:60;opacity:0}12%{opacity:1}65%{stroke-dashoffset:0;opacity:1}82%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:60;opacity:0}}@keyframes ndF{0%{opacity:0}15%{opacity:1}70%{opacity:1}85%{opacity:0}100%{opacity:0}}</style></defs><g><path class="n1" d="M32,32 Q22,24 13,20" stroke="white" stroke-width="0.85" stroke-linecap="round" fill="none"/><path class="n2" d="M32,32 Q42,25 51,22" stroke="white" stroke-width="0.85" stroke-linecap="round" fill="none"/><path class="n3" d="M32,32 Q20,40 11,45" stroke="white" stroke-width="0.85" stroke-linecap="round" fill="none"/><path class="n4" d="M32,32 Q44,40 53,45" stroke="white" stroke-width="0.85" stroke-linecap="round" fill="none"/><path class="n5" d="M32,32 Q33,18 33,7" stroke="white" stroke-width="0.85" stroke-linecap="round" fill="none"/><path class="n6" d="M13,20 Q9,26 7,31" stroke="white" stroke-width="0.45" stroke-linecap="round" fill="none"/><path class="n7" d="M51,22 Q55,28 57,33" stroke="white" stroke-width="0.45" stroke-linecap="round" fill="none"/><path class="n8" d="M11,45 Q6,48 4,54" stroke="white" stroke-width="0.45" stroke-linecap="round" fill="none"/><path class="n9" d="M53,45 Q58,48 60,54" stroke="white" stroke-width="0.45" stroke-linecap="round" fill="none"/><circle class="nd" cx="32" cy="32" r="2" fill="white"/><circle class="nd" cx="13" cy="20" r="1.4" fill="white" style="animation-delay:0.28s"/><circle class="nd" cx="51" cy="22" r="1.4" fill="white" style="animation-delay:0.56s"/><circle class="nd" cx="11" cy="45" r="1.2" fill="white" style="animation-delay:0.84s"/><circle class="nd" cx="53" cy="45" r="1.2" fill="white" style="animation-delay:1.12s"/><circle class="nd" cx="33" cy="7" r="1.2" fill="white" style="animation-delay:1.12s"/></g></svg>';

// ── Unique class prefix for animation isolation ──
function makeid(len){var c='abcdefghijklmnopqrstuvwxyz',r='';for(var i=0;i<len;i++)r+=c[Math.floor(Math.random()*c.length)];return r;}

function scopeSVGClasses(svg) {
  var prefix = makeid(6);
  // Find all class names defined in <style> blocks
  var styleMatch = svg.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
  if (!styleMatch) return svg;
  var styleContent = styleMatch[1];
  // Extract all class names defined in the style block (e.g. .ap1, .r2, .nD)
  var classNames = [];
  var re = /\.([\w-]+)\s*\{/g;
  var m;
  while ((m = re.exec(styleContent)) !== null) {
    if (classNames.indexOf(m[1]) === -1) classNames.push(m[1]);
  }
  // Also catch keyframe animation names referenced in animation properties
  var animNames = [];
  var animRe = /animation:\s*[\w\s,.]*?([\w]+)\s+[\d]/g;
  while ((m = animRe.exec(styleContent)) !== null) {
    // last word before the duration is the animation name — capture keyframe names instead
  }
  var keyframeRe = /@keyframes\s+([\w-]+)/g;
  while ((m = keyframeRe.exec(styleContent)) !== null) {
    if (animNames.indexOf(m[1]) === -1) animNames.push(m[1]);
  }
  // Replace class names and keyframe names throughout the SVG
  var result = svg;
  // Sort by length descending to avoid partial replacements
  classNames.sort(function(a,b){return b.length-a.length;});
  animNames.sort(function(a,b){return b.length-a.length;});
  classNames.forEach(function(cn) {
    var escaped = cn.replace(/[-]/g,'\\-');
    // In style block: .className
    result = result.replace(new RegExp('\\.'+escaped+'([\\s{,:])', 'g'), '.'+prefix+cn+'$1');
    // In HTML attributes: class="... className ..."
    result = result.replace(new RegExp('(class="[^"]*?)\\b'+escaped+'\\b([^"]*?")', 'g'), '$1'+prefix+cn+'$2');
  });
  animNames.forEach(function(an) {
    var escaped = an.replace(/[-]/g,'\\-');
    // In @keyframes declaration
    result = result.replace(new RegExp('@keyframes\\s+'+escaped+'\\b', 'g'), '@keyframes '+prefix+an);
    // In animation property values
    result = result.replace(new RegExp('animation(-name)?:\\s*([^;}"\']*?)\\b'+escaped+'\\b', 'g'), function(match, p1, p2) {
      return match.replace(new RegExp('\\b'+escaped+'\\b'), prefix+an);
    });
  });
  return result;
}

// ── extractSVG — strict ──
function extractSVG(r) {
  r = r.replace(/^```[\w]*\n?/gm, '').replace(/\n?```$/gm, '').trim();
  var start = r.search(/<svg[\s>]/i);
  if (start === -1) return '';
  var end = r.indexOf('</svg>', start);
  if (end === -1) return '';
  var svg = r.slice(start, end + 6);
  if (!svg.includes('xmlns') || !svg.includes('viewBox')) return '';
  if (!/<(path|circle|ellipse|line|rect|polyline|polygon)/.test(svg)) return '';
  if (/<\/(div|p|span|button|html|body)>/i.test(svg)) return '';
  return svg;
}

// ── Favourites (localStorage, cap 12) ──
var FAV_KEY = 'bes-icon-favourites-v1';
var MAX_FAVS = 12;

function loadFavourites() {
  try { var s = localStorage.getItem(FAV_KEY); return s ? JSON.parse(s) : []; }
  catch(e) { return []; }
}
function saveFavourites(favs) {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e) {}
}
function addFavourite(icon) {
  var favs = loadFavourites();
  // Avoid duplicates by id
  favs = favs.filter(function(f){ return f.id !== icon.id; });
  favs.unshift({ id: icon.id, prompt: icon.prompt, svg: icon.svg, savedAt: Date.now() });
  if (favs.length > MAX_FAVS) favs = favs.slice(0, MAX_FAVS);
  saveFavourites(favs);
}
function removeFavourite(id) {
  var favs = loadFavourites().filter(function(f){ return f.id !== id; });
  saveFavourites(favs);
}
function isFavourite(id) {
  return loadFavourites().some(function(f){ return f.id === id; });
}

// ── Profile ──
var DEFAULT_PROFILE={likedSubjects:[],dislikedSubjects:[],feedbackLog:[]};
var profile=loadProfile();
function loadProfile(){try{var s=localStorage.getItem('bes-icon-profile-v8');return s?Object.assign({},DEFAULT_PROFILE,JSON.parse(s)):JSON.parse(JSON.stringify(DEFAULT_PROFILE));}catch(e){return JSON.parse(JSON.stringify(DEFAULT_PROFILE));}}
function saveProfile(){try{localStorage.setItem('bes-icon-profile-v8',JSON.stringify(profile));}catch(e){}}
function resetProfile(){profile=JSON.parse(JSON.stringify(DEFAULT_PROFILE));saveProfile();render();}

function handleFeedback(id, dir) {
  var icon = animatedIcons.find(function(i){return i.id==id;});
  if(!icon) return;
  if(dir===1){
    profile.likedSubjects=Array.from(new Set([icon.prompt].concat(profile.likedSubjects))).slice(0,8);
    profile.dislikedSubjects=profile.dislikedSubjects.filter(function(s){return s!==icon.prompt;});
  } else {
    profile.dislikedSubjects=Array.from(new Set([icon.prompt].concat(profile.dislikedSubjects))).slice(0,8);
    profile.likedSubjects=profile.likedSubjects.filter(function(s){return s!==icon.prompt;});
  }
  profile.feedbackLog=profile.feedbackLog.slice(-19).concat([{dir:dir,t:Date.now()}]);
  feedbackMap[id]=dir;
  saveProfile();
  render();
}

function handleHeart(id) {
  var icon = animatedIcons.find(function(i){ return i.id == id; });
  // Also check favourites list itself (re-hearting from favs section)
  if (!icon) {
    var favs = loadFavourites();
    icon = favs.find(function(f){ return f.id == id; });
  }
  if (!icon) return;
  if (isFavourite(id)) {
    removeFavourite(id);
  } else {
    addFavourite(icon);
  }
  render();
}

// ── System prompts ──
function buildGeometrySystemPrompt() {
  return `You are a visual designer working for Butterfly Effect, a creative studio and social media agency built on the theory of chaos.

BRAND THEORY:
Everything is interconnected. Inspired by Chaos Theory, the studio recognises that in the ever-shifting world of digital marketing and social content, the tiniest shift can lead to monumental impact. A viral post, a trend sparked by a TikTok, or a brand's authentic collaboration with the right influencer can create waves of influence that reach far beyond the moment. Butterfly Effect harnesses this unpredictable beauty, crafting stories, campaigns, and content that may begin as an idea but has the potential to transform across platforms, communities, and cultures. We don't just create campaigns, we set movements in motion. Every small moment matters.

VISUAL LANGUAGE:
The brand logo is the butterfly icon, built from nested looping orbital paths, layered concentric curves that form wing shapes through repetition and overlap, not illustration. The aesthetic examples in the brand book show a Lissajous figure with petal-like loops, a spirograph-type orbital pattern, and a Lorenz attractor, all rendered as thin white line drawings on dark backgrounds. The visual language is mathematical precision expressed as organic form. Structured systems that appear to breathe.

AESTHETIC:
Dark backgrounds. White strokes. No fills. Thin line weight. Negative space is as important as the drawn elements. Precision with organic imperfection. The icons should feel like they were drawn by a steady hand that understands mathematics.

THE FIVE EXISTING ICONS AS EXAMPLES OF QUALITY AND APPROACH:
1. Strange Attractor: the actual Lorenz attractor mathematical form. A figure-eight orbital path that loops back through its own centre. Directly mirrors the butterfly icon construction.
2. Ripple Effect: concentric irregular rings expanding outward from a single point. Represents small action, monumental impact.
3. Network: minimal dots connected by curved lines suggesting interconnection and movement.
4. Spiral: a single continuous curved line coiling outward from centre.
5. Fragmented Grid: a tight grid that dissolves into scattered points toward one corner. Order becoming chaos.

YOUR TASK:
Given a subject, describe THREE distinct geometric approaches for an icon within this visual language. Each approach should interpret the subject differently. Think about what the subject IS geometrically and what it DOES as a system or force.

For each approach write:
APPROACH 1: [one sentence name]
[3-4 sentences describing the specific geometry, what SVG elements to use, and exact proportions within a 64x64 space centred at 32,32]

APPROACH 2: [one sentence name]
[3-4 sentences]

APPROACH 3: [one sentence name]
[3-4 sentences]

No code, no SVG, no markdown beyond this structure.`;
}

function buildStaticRenderSystemPrompt() {
  return `You are an SVG engineer building icons for Butterfly Effect, a studio whose visual language is mathematical precision expressed as organic form.

CONSTRUCTION RULES:

1. VIEWBOX: Always 64x64. Centre is 32,32. All coordinates must stay between 4 and 60. Maximum radius from centre is 26. Never place any point outside these bounds.

2. STROKES: White strokes only. No fills except one small anchor dot (r 1.2 to 1.8, fill white, opacity 0.7-0.9) at the focal point. stroke-linecap="round" on every element. Stroke weights: primary 0.8-1.1, secondary 0.5-0.7, tertiary 0.3-0.45.

3. STATIC ONLY: No animation, no CSS keyframes. This is a static icon. Clean, precise geometry only.

4. ELEMENTS: Use the right primitive for the geometry. Ellipses for rings and ovals. Lines for straight edges. Paths with cubic bezier curves for organic forms. Do not force curves onto straight geometry or straight lines onto curved geometry.

5. OPACITY LAYERING: Where the geometry has multiple echo elements, apply opacity 1.0 to primary, 0.5 to secondary, 0.3 to tertiary. This creates depth without colour.

6. ASYMMETRIC PATH GEOMETRY: This is critical. Never use perfectly symmetric control points in cubic bezier paths. When drawing organic forms, looping paths, orbital shapes, or any path that could feel mathematical and mechanical, introduce deliberate slight irregularities into the control point coordinates. For example instead of C20 20,44 20,44 32 use C19 21,45 18,44 33. Mirrored sides of a shape should never have identical coordinate values. The goal is geometry that looks like it was drawn by a steady intelligent hand, not generated by a formula. This applies to paths only, not to ellipses or lines which are intentionally precise.

OUTPUT: Raw SVG only. No markdown, no backticks, no explanation.
Opening tag exactly: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64">
Close with </svg>
Complete valid SVG. Never truncate.`;
}

function buildAnimateSystemPrompt() {
  return `You are an SVG animation artist. You will receive a static SVG icon and a subject. Your job is to animate the existing geometry in a way that reflects what the subject does.

ANIMATION PRINCIPLES:
- The animation must be tied to the concept. A ripple expands. A spiral unwinds. A network builds connection by connection. A flame flickers. An orbit rotates. Choose the motion that is true to the subject.
- Do not invent new geometry. Animate exactly what is already there.
- All animations are CSS keyframes inside a <style> block inside <defs>.
- All animations infinite.
- Use unique class name prefixes to avoid conflicts.

PROVEN ANIMATION PATTERNS:
- Path that traces itself: add stroke-dasharray equal to path length, stroke-dashoffset animates from full length to 0, then fades and resets. Good for: attractors, spirals, outlines, orbits.
- Elements that expand outward: CSS transform scale from 0.6 to 1.0 with opacity fade in and out. Good for: ripples, pulses, shockwaves.
- Elements that sequence in one by one: stagger animation-delay across sibling elements so they build sequentially. Good for: networks, grids, constellations.
- Continuous rotation: CSS rotate transform on the group. Good for: orbits, wheels, vortex.
- Opacity breathing: opacity oscillates between 0.2 and 1.0 with ease-in-out. Good for: signals, pulses, glows.
- Float or drift: subtle translate animation, 2-3px movement. Good for: particles, dust, scatter.

STAGGER TIMING: Always stagger delays across elements. Never animate everything simultaneously.

FRACTAL NOISE DISPLACEMENT FILTER: Add this filter only when the subject is an organic, looping, or orbital form such as an attractor, spiral, orbit, vortex, wave, or any single continuous path. It gives lines a hand-drawn organic quality. Do not add it to structured systems like grids, networks, or constellations where precision is part of the concept.

When adding the filter, use this exact structure inside <defs>:
<filter id="UNIQUEID" x="-15%" y="-15%" width="130%" height="130%">
<feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="4" seed="RANDOMSEED" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
</filter>
Use a random seed between 1 and 99. Wrap all drawn elements in <g filter="url(#UNIQUEID)">.

OUTPUT: Return the complete SVG with animation added. Raw SVG only. No markdown, no backticks, no explanation. Never truncate.`;
}

// ── GIF encoder ──
function encodeGIF(frames,w,h,delay){
  delay=delay||5;
  function lzwEncode(pixels,minCode){var clear=1<<minCode,eoi=clear+1,codeSize=minCode+1,dict=new Map(),code=eoi+1,buf=0,bufBits=0,out=[];function emit(c){buf|=c<<bufBits;bufBits+=codeSize;while(bufBits>=8){out.push(buf&0xff);buf>>=8;bufBits-=8;}}for(var i=0;i<(1<<minCode);i++)dict.set(String(i),[i]);emit(clear);var chain=[];for(var i=0;i<pixels.length;i++){var px=pixels[i],next=chain.concat([px]),key=next.join(',');if(dict.has(key)){chain=next;}else{var cv=dict.get(chain.join(','));emit(cv?cv[0]:chain[0]);dict.set(key,[code++]);chain=[px];if(code>(1<<codeSize)&&codeSize<12)codeSize++;}}if(chain.length){var cv=dict.get(chain.join(','));emit(cv?cv[0]:chain[0]);}emit(eoi);if(bufBits>0)out.push(buf&0xff);return out;}
  function buildPalette(fd){var freq=new Map();for(var fi=0;fi<fd.length;fi++){var f=fd[fi];for(var i=0;i<f.length;i+=4){if(f[i+3]<128)continue;var k=(f[i]>>3)+','+(f[i+1]>>3)+','+(f[i+2]>>3);freq.set(k,(freq.get(k)||0)+1);}}var sorted=Array.from(freq.entries()).sort(function(a,b){return b[1]-a[1];});var pal=[[0,0,0]];for(var i=0;i<Math.min(254,sorted.length);i++){var parts=sorted[i][0].split(',');pal.push([parseInt(parts[0])<<3,parseInt(parts[1])<<3,parseInt(parts[2])<<3]);}while(pal.length<256)pal.push([0,0,0]);return pal;}
  function quantize(rgba,pal){var out=[];for(var i=0;i<rgba.length;i+=4){if(rgba[i+3]<128){out.push(0);continue;}var r=rgba[i],g=rgba[i+1],b=rgba[i+2],best=1,bestD=1e9;for(var j=1;j<pal.length;j++){var dr=r-pal[j][0],dg=g-pal[j][1],db=b-pal[j][2],d=dr*dr+dg*dg+db*db;if(d<bestD){bestD=d;best=j;}}out.push(best);}return out;}
  function word(n){return[n&0xff,(n>>8)&0xff];}
  var fd=frames.map(function(c){return c.getContext('2d').getImageData(0,0,w,h).data;});
  var pal=buildPalette(fd),bytes=[];
  [0x47,0x49,0x46,0x38,0x39,0x61].forEach(function(b){bytes.push(b);});
  word(w).forEach(function(b){bytes.push(b);});word(h).forEach(function(b){bytes.push(b);});bytes.push(0xf7,0,0);
  pal.forEach(function(c){bytes.push(c[0],c[1],c[2]);});
  bytes.push(0x21,0xff,0x0b,0x4e,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2e,0x30,3,1,0,0,0);
  fd.forEach(function(rgba){
    var idx=quantize(rgba,pal);
    bytes.push(0x21,0xf9,4,0x01);word(delay).forEach(function(b){bytes.push(b);});bytes.push(0,0);
    bytes.push(0x2c);word(0).forEach(function(b){bytes.push(b);});word(0).forEach(function(b){bytes.push(b);});word(w).forEach(function(b){bytes.push(b);});word(h).forEach(function(b){bytes.push(b);});bytes.push(0);
    var comp=lzwEncode(idx,8);bytes.push(8);
    for(var i=0;i<comp.length;i+=255){var chunk=comp.slice(i,i+255);bytes.push(chunk.length);chunk.forEach(function(b){bytes.push(b);});}
    bytes.push(0);
  });
  bytes.push(0x3b);
  return new Uint8Array(bytes);
}

async function captureSVGGIF(svgString,name,variant){
  var size=128,fps=20,duration=4,totalFrames=fps*duration;
  var s=applyVariant(svgString,variant);
  var bgColor=variant==='white-black'?'#0a0a0a':variant==='black-white'?'#ffffff':null;
  var blob=new Blob([s],{type:'image/svg+xml'});
  var url=URL.createObjectURL(blob);
  var container=document.createElement('div');
  container.style.cssText='position:fixed;left:-9999px;top:-9999px;width:'+size+'px;height:'+size+'px;';
  document.body.appendChild(container);
  var img=document.createElement('img');img.width=size;img.height=size;img.src=url;container.appendChild(img);
  await new Promise(function(r){img.onload=r;});
  await new Promise(function(r){setTimeout(r,80);});
  var canvases=[];
  for(var i=0;i<totalFrames;i++){
    await new Promise(function(r){setTimeout(r,1000/fps);});
    var cv=document.createElement('canvas');cv.width=size;cv.height=size;
    var ctx=cv.getContext('2d');
    if(bgColor){ctx.fillStyle=bgColor;ctx.fillRect(0,0,size,size);}
    try{ctx.drawImage(img,0,0,size,size);}catch(e){}
    canvases.push(cv);
  }
  document.body.removeChild(container);URL.revokeObjectURL(url);
  triggerGIFDownload(encodeGIF(canvases,size,size,Math.round(100/fps)),name+'-'+variant+'.gif');
}

// ── Canvas spiral GIF capture ──
async function captureCanvasGIF(sourceCanvas, name) {
  var size = 128, fps = 20, duration = 4, totalFrames = fps * duration;
  var canvases = [];
  for (var i = 0; i < totalFrames; i++) {
    await new Promise(function(r){ setTimeout(r, 1000/fps); });
    var cv = document.createElement('canvas'); cv.width = size; cv.height = size;
    var ctx = cv.getContext('2d');
    ctx.drawImage(sourceCanvas, 0, 0, size, size);
    canvases.push(cv);
  }
  triggerGIFDownload(encodeGIF(canvases, size, size, Math.round(100/fps)), name + '.gif');
}

function triggerGIFDownload(gif,filename){
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([gif],{type:'image/gif'}));a.download=filename;a.click();
}

function applyVariant(s,variant){
  var inv=variant==='black-transparent'||variant==='black-white';
  if(inv){s=s.replace(/stroke="white"/g,'stroke="black"').replace(/fill="white"/g,'fill="black"').replace(/rgba\(255,255,255,/g,'rgba(0,0,0,');}
  if(variant==='white-black'||variant==='black-white'){var bg=variant==='white-black'?'#0a0a0a':'#ffffff';s=s.replace(/<svg([^>]*)>/,'<svg$1><rect width="64" height="64" fill="'+bg+'"/>');}
  return s;
}
function downloadSVG(svgString,name,variant){var s=applyVariant(svgString,variant);var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));a.download=name+'-'+variant+'.svg';a.click();}
function downloadPNGfromSVG(svgString,name,variant,size){
  size=size||512;var s=applyVariant(svgString,variant),bgColor=variant==='white-black'?'#0a0a0a':variant==='black-white'?'#ffffff':null;
  var url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));
  var img=new Image();img.src=url;
  img.onload=function(){var cv=document.createElement('canvas');cv.width=size;cv.height=size;var ctx=cv.getContext('2d');if(bgColor){ctx.fillStyle=bgColor;ctx.fillRect(0,0,size,size);}ctx.drawImage(img,0,0,size,size);var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=name+'-'+variant+'.png';a.click();URL.revokeObjectURL(url);};
}

// ── Canvas spiral ──
var TURNS=3.5,STEPS=320;
function bakeWobble(amp){var wx=[],wy=[];for(var i=0;i<=STEPS;i++){var t=i/STEPS;wx.push((Math.random()-0.5)*amp+Math.sin(t*11.3+Math.random()*0.4)*amp*0.5+(Math.random()-0.5)*amp*0.3);wy.push((Math.random()-0.5)*amp*0.65+Math.sin(t*9.7+Math.random()*0.4)*amp*0.35+(Math.random()-0.5)*amp*0.2);}return{wx:wx,wy:wy};}
function makeSpiralLayers(){var w1=bakeWobble(1.3),w2=bakeWobble(1.0),w3=bakeWobble(0.7);return[{opacity:0.92,lw:1.1,lag:0,wx:w1.wx,wy:w1.wy},{opacity:0.48,lw:0.6,lag:0.06,wx:w2.wx,wy:w2.wy},{opacity:0.22,lw:0.32,lag:0.12,wx:w3.wx,wy:w3.wy}];}
function runSpiral(canvas){
  var ctx=canvas.getContext('2d'),W=72,H=72,cx=36,cy=36;
  var rotY=0,rotX=-0.25,time=0,head=0,tail=0,holdTimer=0,phase='drawing',last=null;
  var layers=makeSpiralLayers();
  var speedTable=(function(){var t=[],s=0;for(var i=0;i<=STEPS;i++){var v=i/STEPS,sp=0.72+0.28*v+0.12*Math.sin(v*TURNS*Math.PI*2);t.push(s);s+=sp;}for(var j=0;j<=STEPS;j++)t[j]/=s;return t;})();
  function pIdx(p){var lo=0,hi=STEPS;while(lo<hi){var m=(lo+hi)>>1;if(speedTable[m]<p)lo=m+1;else hi=m;}return lo;}
  function ease(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
  function proj(x,y,z,rX,rY){var x1=x*Math.cos(rY)-z*Math.sin(rY),z1=x*Math.sin(rY)+z*Math.cos(rY),y2=y*Math.cos(rX)-z1*Math.sin(rX),z2=y*Math.sin(rX)+z1*Math.cos(rX),fov=3.8,pz=fov/(fov+z2*0.01);return{sx:x1*1.0*pz,sy:y2*1.0*pz,depth:z2};}
  function frame(ts){
    if(!last)last=ts;var dt=Math.min((ts-last)/1000,0.05);last=ts;time+=dt;
    rotY+=(0.42+0.18*Math.sin(time*0.7)+0.08*Math.sin(time*1.3))*dt;
    rotX=-0.25+0.05*Math.sin(time*0.23)+0.02*Math.sin(time*0.41);
    if(phase==='drawing'){head=Math.min(1,head+dt*0.36);if(head>=1){phase='holding';holdTimer=0;}}
    else if(phase==='holding'){holdTimer+=dt;if(holdTimer>1.4)phase='dissolving';}
    else{tail=Math.min(1,tail+dt*0.28);if(tail>=1){head=0;tail=0;phase='drawing';layers=makeSpiralLayers();}}
    ctx.clearRect(0,0,W,H);
    layers.forEach(function(layer){
      var hN=pIdx(Math.min(0.9999,ease(Math.min(1,Math.max(0,head-layer.lag))))),tN=pIdx(Math.min(0.9999,ease(Math.min(1,Math.max(0,tail-layer.lag*0.5)))));
      if(hN<2)return;
      for(var i=tN;i<hN-1;i++){
        var t0=i/STEPS,t1=(i+1)/STEPS,a0=t0*TURNS*Math.PI*2,r0=t0*12,a1=t1*TURNS*Math.PI*2,r1=t1*12;
        var p0=proj(Math.cos(a0)*r0+layer.wx[i],(1-t0)*22-11+layer.wy[i],Math.sin(a0)*r0,rotX,rotY);
        var p1=proj(Math.cos(a1)*r1+layer.wx[i+1],(1-t1)*22-11+layer.wy[i+1],Math.sin(a1)*r1,rotX,rotY);
        var tE=Math.min(1,(i-tN)/14),hE=Math.min(1,(hN-i)/20),dF=Math.max(0.25,Math.min(1,(p0.depth+18)/36)),tp=(0.7+0.3*Math.sin(t0*Math.PI))*(0.88+Math.random()*0.24);
        ctx.beginPath();ctx.moveTo(cx+p0.sx,cy+p0.sy);ctx.lineTo(cx+p1.sx,cy+p1.sy);
        ctx.strokeStyle='rgba(255,255,255,'+(layer.opacity*dF*tE*hE)+')';ctx.lineWidth=layer.lw*tp;ctx.lineCap='round';ctx.stroke();
      }
    });
    var aF=Math.min(1,head*4)*(tail>0?Math.max(0,1-tail*3):1);
    if(aF>0.02){var ap=proj(0,11,0,rotX,rotY);ctx.beginPath();ctx.arc(cx+ap.sx,cy+ap.sy,1.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+(0.9*aF)+')';ctx.fill();}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

var SUBJECT_POOL=["wave","tornado","whirlpool","lightning bolt","ripple","current","vortex","gust of wind","updraft","aurora","solar system","black hole","comet","nebula","orbit","eclipse","pulsar","galaxy spiral","shooting star","event horizon","leaf","fern","coral","seed pod","vine","petal","root system","lotus","moss","spore","flame","smoke","snowflake","ice crystal","steam","ember","frost","raindrop","bubble","tide","infinity loop","spiral","spider web","compass rose","labyrinth","fractal","helix","interference pattern","signal wave","feedback loop","jellyfish","nautilus","butterfly","bird in flight","dragonfly","firefly","moth","sea anemone","eye","feather","hourglass","prism","thread","signal burst","chain","echo"];
var THEMES=["butterfly","cocoon","metamorphosis","emergence","signal","chaos","threshold","cascade","entanglement"];

function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}

function extractSVG(r) {
  r = r.replace(/^```[\w]*\n?/gm, '').replace(/\n?```$/gm, '').trim();
  var start = r.search(/<svg[\s>]/i);
  if (start === -1) return '';
  var end = r.indexOf('</svg>', start);
  if (end === -1) return '';
  var svg = r.slice(start, end + 6);
  if (!svg.includes('xmlns') || !svg.includes('viewBox')) return '';
  if (!/<(path|circle|ellipse|line|rect|polyline|polygon)/.test(svg)) return '';
  if (/<\/(div|p|span|button|html|body)>/i.test(svg)) return '';
  return svg;
}

function storeSVG(id,svg){svgStore[id]=svg;}
function showError(msg){var el=document.getElementById('error-msg');if(el)el.textContent=msg;}

async function apiCall(endpoint, body) {
  var res = await fetch(endpoint, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  var data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function generateOptions(subject) {
  if(loadingGeometry) return;
  currentSubject = subject || pickRandom(SUBJECT_POOL);
  staticOptions = [];
  selectedOptionIndex = -1;
  geometryText = '';
  loadingGeometry = true;
  loadingOptions = [];
  showError('');
  render();

  try {
    var geoData = await apiCall('/api/geometry', {
      systemPrompt: buildGeometrySystemPrompt(),
      prompt: 'Subject: ' + currentSubject + '\n\nDescribe three distinct geometric approaches for an icon of this subject within the Butterfly Effect visual language.'
    });
    geometryText = geoData.text;
    loadingGeometry = false;

    var approaches = parseApproaches(geometryText);

    for(var i = 0; i < Math.min(3, approaches.length); i++) {
      loadingOptions.push(i);
      render();
      try {
        var renderData = await apiCall('/api/render', {
          systemPrompt: buildStaticRenderSystemPrompt(),
          prompt: 'Subject: ' + currentSubject + '\n\nGeometry to build:\n' + approaches[i] + '\n\nBuild this as a static SVG icon. Output SVG only.'
        });
        var svg = extractSVG(renderData.text || '');
        if(svg.includes('<svg')) {
          staticOptions.push({ svg: svg, approach: approaches[i], index: i });
        }
      } catch(e) {
        console.error('Render error for approach ' + i, e.message);
      }
      loadingOptions = loadingOptions.filter(function(x){return x!==i;});
      render();
    }
  } catch(e) {
    showError(e.message || 'Generation failed.');
    loadingGeometry = false;
  }
  render();
}

function parseApproaches(text) {
  var approaches = [];
  var parts = text.split(/APPROACH\s+\d+:/i);
  for(var i = 1; i < parts.length; i++) {
    var trimmed = parts[i].trim();
    if(trimmed.length > 20) approaches.push(trimmed);
  }
  if(approaches.length === 0) approaches.push(text);
  return approaches;
}

function copyStaticSVG(id, btn) {
  var svg = svgStore[id];
  if(!svg) return;
  var ok = copySVG(svg);
  if(ok && btn) { btn.textContent='Copied'; setTimeout(function(){ btn.textContent='Copy SVG'; }, 2000); }
}

async function animateOption(optionIndex) {
  if(animatingIndexes[optionIndex]) return;
  var opt = staticOptions[optionIndex];
  if(!opt) return;
  animatingIndexes[optionIndex] = true;
  showError('');
  render();

  try {
    var res = await fetch('/api/animate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        systemPrompt: buildAnimateSystemPrompt(),
        prompt: 'Subject: ' + currentSubject + '\n\nAnimate this SVG icon. The animation must reflect what "' + currentSubject + '" does. Return the complete animated SVG.\n\n' + opt.svg
      })
    });
    var raw = await res.text();
    var data;
    try { data = JSON.parse(raw); } catch(e) { throw new Error('JSON parse failed: ' + raw.slice(0,100)); }
    if(data.error) throw new Error('API error: ' + data.error);
    var text = data.text || '';
    var svg = extractSVG(text);
    if(!svg.includes('<svg')) throw new Error('No valid SVG in response.');
    // Scope animation classes to prevent collisions
    svg = scopeSVGClasses(svg);
    var icon = { prompt: currentSubject, svg: svg, id: Date.now() + Math.random() };
    storeSVG(icon.id, icon.svg);
    animatedIcons.unshift(icon);
    if(animatedIcons.length > 32) animatedIcons = animatedIcons.slice(0, 32);
  } catch(e) {
    showError(e.message || 'Animation failed.');
  }
  delete animatingIndexes[optionIndex];
  render();
}

function makeSpiralExportDropdown() {
  var gifBusy = !!svgStore['gif-spiral-canvas'];
  var html = '<div data-dropdown="spiral-export" style="position:relative;width:100%;">';
  html += '<button onclick="toggleDropdown(\'spiral-export\')" style="width:100%;padding:5px 0;text-align:center;font-family:Arial,sans-serif;font-size:7px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;border:1px solid #222;color:#fff;background:#0f0f0f;">Export ▾</button>';
  html += '<div class="dd-menu" style="display:none;position:absolute;bottom:calc(100% + 4px);left:0;right:0;background:#0e0e0e;border:1px solid #2a2a2a;z-index:100;padding:12px;min-width:180px;">';
  html += '<div style="font-size:7px;letter-spacing:1.5px;text-transform:uppercase;color:#fff;opacity:0.35;margin-bottom:6px;">PNG</div>';
  html += '<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:12px;">';
  html += '<button onclick="downloadCanvasPNG(\'canvas-spiral-ref\',\'spiral\');toggleDropdown(\'spiral-export\')" style="width:100%;padding:7px 10px;text-align:left;font-family:Arial,sans-serif;font-size:8px;letter-spacing:0.8px;cursor:pointer;border:1px solid #2a2a2a;color:#fff;background:#161616;">Current Frame</button>';
  html += '</div>';
  html += '<div style="font-size:7px;letter-spacing:1.5px;text-transform:uppercase;color:#fff;opacity:'+(gifBusy?0.2:0.35)+';margin-bottom:6px;">GIF</div>';
  html += '<div style="display:flex;flex-direction:column;gap:4px;">';
  html += '<button '+(gifBusy?'disabled':'')+' onclick="handleSpiralGIFExport();toggleDropdown(\'spiral-export\')" style="width:100%;padding:7px 10px;text-align:left;font-family:Arial,sans-serif;font-size:8px;letter-spacing:0.8px;cursor:'+(gifBusy?'not-allowed':'pointer')+';border:1px solid #2a2a2a;color:#fff;background:#161616;opacity:'+(gifBusy?0.3:1)+';">'+(gifBusy?'Exporting...':'Capture Animation')+'</button>';
  html += '</div>';
  html += '</div></div>';
  return html;
}

async function handleSpiralGIFExport() {
  var cv = document.getElementById('canvas-spiral-ref');
  if (!cv) return;
  svgStore['gif-spiral-canvas'] = true; render();
  try { await captureCanvasGIF(cv, 'spiral'); } catch(e) { console.error(e); }
  delete svgStore['gif-spiral-canvas']; render();
}

function downloadPNG(variant,id,name){var svg=svgStore[id];if(svg)downloadPNGfromSVG(svg,name,variant);}
function downloadSVGById(variant,id,name){var svg=svgStore[id];if(svg)downloadSVG(svg,name,variant);}
async function handleGIFExport(id,variant,name){
  svgStore['gif-'+id]=true;render();
  try{var svg=svgStore[id];if(svg)await captureSVGGIF(svg,name,variant);}catch(e){console.error(e);}
  delete svgStore['gif-'+id];render();
}
function handleCopy(id){
  var svg=svgStore[id];if(!svg)return;
  var ok=copySVG(svg);
  if(ok){var btn=document.getElementById('copy-btn-'+id);if(btn){btn.textContent='Copied';setTimeout(function(){btn.textContent='Copy SVG';},2000);}}
}

// ── Main render ──
function render(){
  var app=document.getElementById('app');

  // Reference strip
  var refItems=[
    {key:'attr',label:'Attractor',svg:ATTRACTOR_SVG},
    {key:'ripl',label:'Ripple',svg:RIPPLE_SVG},
    {key:'grid',label:'Grid',svg:GRID_SVG},
    {key:'netw',label:'Network',svg:NETWORK_SVG},
  ];
  var refCardsHtml='';
  refItems.forEach(function(item){
    storeSVG(item.key,item.svg);
    refCardsHtml+='<div style="background:#111;border:1px solid #1e1e1e;padding:14px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:100px;">';
    refCardsHtml+='<div style="width:48px;height:48px;">'+item.svg.replace('width="64" height="64"','width="48" height="48"')+'</div>';
    refCardsHtml+='<span style="font-size:7px;letter-spacing:1.2px;text-transform:uppercase;opacity:0.25;color:#fff;">'+item.label+'</span>';
    refCardsHtml+=makeExportDropdown(item.key,item.label.toLowerCase(),true);
    refCardsHtml+='</div>';
  });
  // Spiral card with export
  refCardsHtml+='<div style="background:#111;border:1px solid #1e1e1e;padding:14px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:100px;">';
  refCardsHtml+='<canvas id="canvas-spiral-ref" width="72" height="72" style="width:48px;height:48px;"></canvas>';
  refCardsHtml+='<span style="font-size:7px;letter-spacing:1.2px;text-transform:uppercase;opacity:0.25;color:#fff;">Spiral</span>';
  refCardsHtml+=makeSpiralExportDropdown();
  refCardsHtml+='</div>';

  // Mode tabs
  var modeBtns='<div style="display:flex;margin-bottom:20px;max-width:480px;">';
  modeBtns+='<button onclick="setMode(\'random\')" style="flex:1;padding:11px 0;font-family:Arial,sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:1px solid '+(mode==='random'?'#341C12':'#222')+';border-right:none;color:#fff;background:'+(mode==='random'?'#1a0e09':'#111')+';">Random</button>';
  modeBtns+='<button onclick="setMode(\'custom\')" style="flex:1;padding:11px 0;font-family:Arial,sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:1px solid '+(mode==='custom'?'#341C12':'#222')+';color:#fff;background:'+(mode==='custom'?'#1a0e09':'#111')+';">Custom</button>';
  modeBtns+='</div>';

  var isGenerating = loadingGeometry || loadingOptions.length > 0;
  var anyAnimating = Object.keys(animatingIndexes).length > 0;

  var controlsHtml='<div style="max-width:480px;margin-bottom:36px;display:flex;flex-direction:column;gap:10px;">';
  if(mode==='custom'){
    controlsHtml+='<input id="custom-input" placeholder="Describe an icon..." onkeydown="if(event.key===\'Enter\'){var v=this.value.trim();if(v)generateOptions(v);}" style="background:#111;border:1px solid #222;color:#fff;padding:12px 16px;font-family:Arial,sans-serif;font-size:10px;letter-spacing:1px;outline:none;width:100%;"/>';
    controlsHtml+='<button onclick="var v=document.getElementById(\'custom-input\').value.trim();if(v)generateOptions(v);" '+(isGenerating?'disabled':'')+' style="padding:12px 0;width:100%;font-family:Arial,sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;cursor:'+(isGenerating?'not-allowed':'pointer')+';border:1px solid #341C12;color:'+(isGenerating?'#444':'#fff')+';background:#1a0e09;opacity:'+(isGenerating?0.5:1)+';">'+(isGenerating?'Generating...':'Generate')+'</button>';
  } else {
    controlsHtml+='<button onclick="generateOptions()" '+(isGenerating?'disabled':'')+' style="width:100%;padding:15px 0;font-family:Arial,sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:'+(isGenerating?'not-allowed':'pointer')+';border:1px solid #341C12;color:'+(isGenerating?'#444':'#fff')+';background:#1a0e09;opacity:'+(isGenerating?0.5:1)+';">'+(isGenerating?'Generating...':'Generate')+'</button>';
    controlsHtml+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">';
    THEMES.forEach(function(t){controlsHtml+='<button onclick="generateOptions(\''+t+'\')" '+(isGenerating?'disabled':'')+' style="padding:9px 12px;font-family:Arial,sans-serif;font-size:8px;letter-spacing:1.4px;text-transform:uppercase;cursor:'+(isGenerating?'not-allowed':'pointer')+';border:1px solid #222;color:#fff;background:#111;text-align:center;">'+t+'</button>';});
    controlsHtml+='</div>';
  }
  controlsHtml+='</div>';

  var loadingHtml='';
  if(loadingGeometry){
    loadingHtml='<div style="max-width:480px;margin-bottom:24px;padding:16px;background:#111;border:1px solid #1e1e1e;">';
    loadingHtml+='<p style="font-size:8px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.4;">Designing geometry...</p>';
    loadingHtml+='</div>';
  }

  // Static options
  var optionsHtml='';
  if(staticOptions.length > 0 || loadingOptions.length > 0){
    optionsHtml+='<div style="margin-bottom:32px;">';
    if(currentSubject) optionsHtml+='<p style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.3;margin-bottom:16px;">'+currentSubject+' — '+staticOptions.length+' option'+(staticOptions.length!==1?'s':'')+' ready</p>';
    optionsHtml+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:620px;">';

    staticOptions.forEach(function(opt){
      var isBusy = !!animatingIndexes[opt.index];
      var optId = 'static-opt-'+opt.index;
      storeSVG(optId, opt.svg);
      optionsHtml+='<div style="background:#111;border:1px solid #1e1e1e;padding:20px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;">';
      optionsHtml+='<div style="width:64px;height:64px;">'+opt.svg+'</div>';
      optionsHtml+='<button onclick="animateOption('+opt.index+')" '+(isBusy?'disabled':'')+' style="width:100%;padding:8px 0;font-family:Arial,sans-serif;font-size:7px;letter-spacing:1.5px;text-transform:uppercase;cursor:'+(isBusy?'not-allowed':'pointer')+';border:1px solid #341C12;color:'+(isBusy?'#444':'#fff')+';background:#1a0e09;opacity:'+(isBusy?0.5:1)+';">'+(isBusy?'Animating...':'Animate')+'</button>';
      optionsHtml+='<div style="display:flex;gap:6px;width:100%;">';
      optionsHtml+='<button onclick="downloadPNG(\'white-transparent\',\''+optId+'\',\'option-'+opt.index+'\')" style="flex:1;padding:5px 0;font-family:Arial,sans-serif;font-size:7px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:1px solid #222;color:#fff;background:#0f0f0f;">PNG</button>';
      optionsHtml+='<button onclick="copyStaticSVG(\''+optId+'\',this)" style="flex:1;padding:5px 0;font-family:Arial,sans-serif;font-size:7px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:1px solid #222;color:#fff;background:#0f0f0f;">Copy SVG</button>';
      optionsHtml+='</div>';
      optionsHtml+='</div>';
    });

    loadingOptions.forEach(function(){
      optionsHtml+='<div style="background:#111;border:1px solid #1e1e1e;padding:24px 16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:140px;">';
      optionsHtml+='<p style="font-size:7px;letter-spacing:1.2px;text-transform:uppercase;opacity:0.2;">Rendering...</p>';
      optionsHtml+='</div>';
    });

    optionsHtml+='</div></div>';
  }

  // Favourites section
  var favs = loadFavourites();
  var favsHtml = '';
  if (favs.length > 0) {
    favsHtml += '<div style="margin-bottom:40px;">';
    favsHtml += '<p style="font-size:8px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.2;margin-bottom:16px;">Favourites — '+favs.length+' / '+MAX_FAVS+'</p>';
    favsHtml += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;max-width:900px;">';
    favs.forEach(function(fav) {
      storeSVG(fav.id, fav.svg);
      favsHtml += '<div style="background:#111;border:1px solid #2a1f10;display:flex;flex-direction:column;align-items:center;padding:28px 16px 16px;gap:10px;">';
      favsHtml += '<div style="width:64px;height:64px;">'+fav.svg+'</div>';
      favsHtml += '<p style="font-size:8px;letter-spacing:1.2px;text-transform:uppercase;opacity:0.3;text-align:center;margin:0;">'+fav.prompt+'</p>';
      favsHtml += '<div style="display:flex;gap:6px;width:100%;">';
      favsHtml += '<button onclick="removeFavourite(\''+fav.id+'\');render();" style="flex:1;padding:5px 0;font-family:Arial,sans-serif;font-size:11px;cursor:pointer;border:1px solid #2a1f10;color:#c8743a;background:#1a0e05;" title="Remove from favourites">♥</button>';
      favsHtml += '<button id="copy-btn-'+fav.id+'" onclick="handleCopy(\''+fav.id+'\')" style="flex:1;padding:5px 0;font-family:Arial,sans-serif;font-size:7px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:1px solid #222;color:#fff;background:#0f0f0f;">Copy SVG</button>';
      favsHtml += '</div>';
      favsHtml += makeExportDropdown(fav.id, fav.prompt, true);
      favsHtml += '</div>';
    });
    favsHtml += '</div></div>';
  }

  // Animated icons grid
  var gridHtml='';
  if(animatedIcons.length > 0){
    gridHtml+='<p style="font-size:8px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.15;margin-bottom:16px;">Generated</p>';
    gridHtml+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;max-width:900px;">';
    animatedIcons.forEach(function(icon){
      var fb=feedbackMap[icon.id];
      var faved = isFavourite(icon.id);
      var border=fb===1?'#2E5038':fb===-1?'#3a1a1a':'#1e1e1e';
      storeSVG(icon.id,icon.svg);
      gridHtml+='<div style="background:#111;border:1px solid '+border+';display:flex;flex-direction:column;align-items:center;padding:28px 16px 16px;gap:10px;">';
      gridHtml+='<div style="width:64px;height:64px;">'+icon.svg+'</div>';
      gridHtml+='<p style="font-size:8px;letter-spacing:1.2px;text-transform:uppercase;opacity:0.3;text-align:center;margin:0;">'+icon.prompt+'</p>';
      gridHtml+='<div style="display:flex;gap:6px;width:100%;">';
      gridHtml+='<button onclick="handleFeedback('+icon.id+',1)" style="flex:1;padding:5px 0;font-family:Arial,sans-serif;font-size:11px;cursor:pointer;border:1px solid #222;color:#fff;background:'+(fb===1?'#1E3325':'#0f0f0f')+';">✓</button>';
      gridHtml+='<button onclick="handleFeedback('+icon.id+',-1)" style="flex:1;padding:5px 0;font-family:Arial,sans-serif;font-size:11px;cursor:pointer;border:1px solid #222;color:#fff;background:'+(fb===-1?'#2a1010':'#0f0f0f')+';">✕</button>';
      gridHtml+='<button onclick="handleHeart('+icon.id+')" style="flex:1;padding:5px 0;font-family:Arial,sans-serif;font-size:11px;cursor:pointer;border:1px solid '+(faved?'#2a1f10':'#222')+';color:'+(faved?'#c8743a':'#fff')+';background:'+(faved?'#1a0e05':'#0f0f0f')+';">♥</button>';
      gridHtml+='</div>';
      gridHtml+='<button id="copy-btn-'+icon.id+'" onclick="handleCopy('+icon.id+')" style="padding:6px 0;width:100%;text-align:center;font-family:Arial,sans-serif;font-size:7px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;border:1px solid #222;color:#fff;background:#151515;">Copy SVG</button>';
      gridHtml+=makeExportDropdown(icon.id,icon.prompt,true);
      gridHtml+='</div>';
    });
    gridHtml+='</div>';
  } else if(!isGenerating && staticOptions.length === 0) {
    gridHtml='<p style="opacity:0.06;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-top:8px;">Press generate.</p>';
  }

  app.innerHTML=
    '<p style="font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:0.4;margin:0 0 4px;">Butterfly Effect</p>'+
    '<p style="font-size:10px;letter-spacing:1px;opacity:0.2;margin:0 0 28px;">Icon Generator — V8.1</p>'+
    '<p style="font-size:8px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.2;margin-bottom:10px;">Reference Set</p>'+
    '<div style="display:flex;gap:10px;margin-bottom:36px;flex-wrap:wrap;">'+refCardsHtml+'</div>'+
    modeBtns+controlsHtml+
    '<p id="error-msg" style="color:#c0392b;font-size:10px;letter-spacing:1px;margin-bottom:24px;max-width:480px;"></p>'+
    loadingHtml+optionsHtml+favsHtml+gridHtml;

  var sc=document.getElementById('canvas-spiral-ref');
  if(sc&&!sc._running){sc._running=true;runSpiral(sc);}
}

function setMode(m){mode=m;render();}
render();
</script>
