function makeSpiral(cx,cy,turns,maxR,steps){var pts=[];for(var i=0;i<=steps;i++){var t=i/steps,a=t*turns*Math.PI*2-Math.PI/2,r=t*maxR;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return pts.map(function(p,i){return(i===0?'M':'L')+p[0].toFixed(2)+','+p[1].toFixed(2);}).join(' ');}
function spiralDashLen(turns,maxR,steps){var pts=[];for(var i=0;i<=steps;i++){var t=i/steps,a=t*turns*Math.PI*2,r=t*maxR;pts.push([Math.cos(a)*r,Math.sin(a)*r]);}var len=0;for(var i=1;i<pts.length;i++){var dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1];len+=Math.sqrt(dx*dx+dy*dy);}return Math.ceil(len)+20;}

rcle class="sd s4" cx="36" cy="44" r="1.0" fill="white"/><circle class="sd s5" cx="44" cy="42" r="0.9" fill="white"/><circle class="sd s6" cx="52" cy="40" r="0.7" fill="white"/><circle class="sd s7" cx="42" cy="50" r="0.8" fill="white"/><circle class="sd s8" cx="50" cy="50" r="0.6" fill="white"/><circle class="sd s9" cx="56" cy="56" r="0.5" fill="white"/></g></svg>';

// ── Profile ──
var DEFAULT_PROFILE={displacementScale:1.3,echoLayers:3,primaryStroke:1.1,animDuration:3,animStyle:{dashoffset:1,scale:0,translate:0},density:5,likedSubjects:[],dislikedSubjects:[],feedbackLog:[]};
var profile=loadProfile();
function loadProfile(){try{var s=localStorage.getItem('bes-icon-profile');return s?Object.assign({},DEFAULT_PROFILE,JSON.parse(s)):JSON.parse(JSON.stringify(DEFAULT_PROFILE));}catch(e){return JSON.parse(JSON.stringify(DEFAULT_PROFILE));}}
function saveProfile(){try{localStorage.setItem('bes-icon-profile',JSON.stringify(profile));}catch(e){}}
function resetProfile(){profile=JSON.parse(JSON.stringify(DEFAULT_PROFILE));saveProfile();renderMeter();}

function parseSVGProfile(svg){
  var dsm=svg.match(/scale="([\d.]+)"/),swm=svg.match(/stroke-width="([\d.]+)"/),adm=svg.match(/animation:\s*\w+\s+([\d.]+)s/);
  var paths=(svg.match(/<(path|ellipse|line)[^>]*stroke/g)||[]).length;
  var opacities=[];var re=/opacity[=:]["']?([\d.]+)/g,m;while((m=re.exec(svg))!==null){var v=parseFloat(m[1]);if(v<1&&v>0.1)opacities.push(v);}
  return{displacementScale:dsm?parseFloat(dsm[1]):1.3,primaryStroke:swm?parseFloat(swm[1]):1.0,animDuration:adm?parseFloat(adm[1]):3,density:paths,echoLayers:Math.max(2,opacities.length),animStyle:{dashoffset:svg.includes('stroke-dashoffset')?1:0,scale:svg.includes('scale(')?1:0,translate:svg.includes('translate(')?1:0}};
}
function nudgeProfile(parsed,dir,subject){
  var lr=dir===1?0.25:-0.15;
  profile.displacementScale=Math.max(0.5,Math.min(2.5,profile.displacementScale+lr*(parsed.displacementScale-profile.displacementScale)*0.4));
  profile.echoLayers=Math.max(1,Math.min(6,profile.echoLayers+lr*(parsed.echoLayers-profile.echoLayers)*0.4));
  profile.primaryStroke=Math.max(0.4,Math.min(2.0,profile.primaryStroke+lr*(parsed.primaryStroke-profile.primaryStroke)*0.4));
  profile.animDuration=Math.max(1.5,Math.min(6,profile.animDuration+lr*(parsed.animDuration-profile.animDuration)*0.4));
  profile.density=Math.max(2,Math.min(12,profile.density+lr*(parsed.density-profile.density)*0.4));
  Object.keys(profile.animStyle).forEach(function(k){profile.animStyle[k]=Math.max(0,Math.min(3,profile.animStyle[k]+lr*(parsed.animStyle[k]-profile.animStyle[k])*0.3));});
  if(subject){if(dir===1){profile.likedSubjects=Array.from(new Set([subject].concat(profile.likedSubjects))).slice(0,8);profile.dislikedSubjects=profile.dislikedSubjects.filter(function(s){return s!==subject;});}else{profile.dislikedSubjects=Array.from(new Set([subject].concat(profile.dislikedSubjects))).slice(0,8);profile.likedSubjects=profile.likedSubjects.filter(function(s){return s!==subject;});}}
  profile.feedbackLog=profile.feedbackLog.slice(-19).concat([{dir:dir,t:Date.now()}]);
  saveProfile();
}
function profileToDirective(){
  var p=profile;
  var animPref=Object.entries(p.animStyle).sort(function(a,b){return b[1]-a[1];})[0][0];
  var lines=['STYLE SIGNAL (learned from feedback):','- Displacement scale: '+p.displacementScale.toFixed(2),'- Echo layers: '+Math.round(p.echoLayers),'- Primary stroke: '+p.primaryStroke.toFixed(2),'- Animation duration: '+p.animDuration.toFixed(1)+'s','- Animation style: '+animPref+'-reveal','- Path density: ~'+Math.round(p.density)];
  if(p.likedSubjects.length)lines.push('- Lean toward subjects like: '+p.likedSubjects.join(', '));
  if(p.dislikedSubjects.length)lines.push('- Lean away from subjects like: '+p.dislikedSubjects.join(', '));
  return lines.join('\n');
}

function buildSystemPrompt(){
  return 'You are an SVG animation artist. You will be given a geometry specification and a style reference. Your only job is to execute the geometry in the style of the reference.\n\n'+
  'STYLE REFERENCE:\n'+
  ATTRACTOR_SVG+'\n\n'+
  'From this reference take: the echo layer system (3 instances of each element at opacity 1.0 / 0.5 / 0.3 with staggered timing), the fractalNoise displacement filter, the dashoffset draw-on animation, the stroke weight progression (1.0 / 0.6 / 0.4). Do not copy the reference geometry under any circumstances.\n\n'+
  'ELEMENT SELECTION: Use the SVG element that honestly matches the geometry. Rings and halos are ellipses. Straight edges are lines. Organic curves are paths. Mixed subjects use mixed elements. Never force cubic bezier paths onto geometry that is not curved.\n\n'+
  'ANIMATION: If the subject has a natural direction (falling, rising, expanding, cascading) use a draw-on fade-out cycle: 0% dashoffset full, draw on, hold, fade, reset. If the subject is cyclical or looping use alternate. Choose based on the geometry, not habit.\n\n'+
  'FILTER SEED: Use a random number between 1 and 99 for the feTurbulence seed. Never use seed 9.\n\n'+
  profileToDirective()+'\n\n'+
  'HARD RULES\n'+
  '- Output ONLY raw SVG. No markdown, no backticks, no explanation.\n'+
  '- Opening tag exactly: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64">\n'+
  '- All styles inside <defs><style></style></defs>\n'+
  '- White strokes only. No fills except small dot accents where meaningful. stroke-linecap="round" everywhere.\n'+
  '- Unique filter id and class prefixes every time. Never reuse fa, fr, fg, fn, fsp.\n'+
  '- All animations infinite. Never static. One SVG only.';
}

function buildGeometryPrompt(subject){
  return 'Subject: '+subject+'\n\nDescribe the essential geometry of this subject. What is its most characteristic shape? What SVG primitives would honestly represent it — ellipses, lines, or curves? What is its dominant direction or motion? Be specific about proportions and composition within a 64x64 space. Do not write any code.';
}

function buildRenderPrompt(subject){
  return 'Subject: '+subject+'\n\nGeometry specification:\n{{GEOMETRY}}\n\nBuild this geometry using the style reference. Apply echo layers, displacement filter, and animation. Output the SVG and nothing else.';
}

// ── GIF encoder ──
function encodeGIF(frames,w,h,delay){
  delay=delay||5;
  function lzwEncode(pixels,minCode){var clear=1<<minCode,eoi=clear+1,codeSize=minCode+1,dict=new Map(),code=eoi+1,buf=0,bufBits=0,out=[];function emit(c){buf|=c<<bufBits;bufBits+=codeSize;while(bufBits>=8){out.push(buf&0xff);buf>>=8;bufBits-=8;}}for(var i=0;i<(1<<minCode);i++)dict.set(String(i),[i]);emit(clear);var chain=[];for(var i=0;i<pixels.length;i++){var px=pixels[i],next=chain.concat([px]),key=next.join(',');if(dict.has(key)){chain=next;}else{var cv=dict.get(chain.join(','));emit(cv?cv[0]:chain[0]);dict.set(key,[code++]);chain=[px];if(code>(1<<codeSize)&&codeSize<12)codeSize++;}}if(chain.length){var cv=dict.get(chain.join(','));emit(cv?cv[0]:chain[0]);}emit(eoi);if(bufBits>0)out.push(buf&0xff);return out;}
  function buildPalette(fd){var freq=new Map();for(var fi=0;fi<fd.length;fi++){var f=fd[fi];for(var i=0;i<f.length;i+=4){if(f[i+3]<128)continue;var k=(f[i]>>3)+','+(f[i+1]>>3)+','+(f[i+2]>>3);freq.set(k,(freq.get(k)||0)+1);}}var sorted=Array.from(freq.entries()).sort(function(a,b){return b[1]-a[1];});var pal=[[0,0,0]];for(var i=0;i<Math.min(254,sorted.length);i++){var parts=sorted[i][0].split(',');pal.push([parseInt(parts[0])<<3,parseInt(parts[1])<<3,parseInt(parts[2])<<3]);}while(pal.length<256)pal.push([0,0,0]);return pal;}
  function quantize(rgba,pal){var out=[];for(var i=0;i<rgba.length;i+=4){if(rgba[i+3]<128){out.push(0);continue;}var r=rgba[i],g=rgba[i+1],b=rgba[i+2],best=1,bestD=1e9;for(var j=1;j<pal.length;j++){var dr=r-pal[j][0],dg=g-pal[j][1],db=b-pal[j][2],d=dr*dr+dg*dg+db*db;if(d<bestD){bestD=d;best=j;}}out.push(best);}return out;}
  function word(n){return[n&0xff,(n>>8)&0xff];}
  var fd=frames.map(function(c){return c.getContext('2d').getImageData(0,0,w,h).data;});
  var pal=buildPalette(fd),bytes=[];
  [0x47,0x49,0x46,0x38,0x39,0x61].forEach(function(b){bytes.push(b);});
  word(w).forEach(function(b){bytes.push(b);});word(h).forEach(function(b){bytes.push(b);});bytes.push(0xf7,0,0);
  pal.forEach(function(c){bytes.push(c[0],c[1],c[2]);});
  bytes.push(0x21,0xff,0x0b,0x4e,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2e,0x30,3,1,0,0,0);
  fd.forEach(function(rgba){
    var idx=quantize(rgba,pal);
    bytes.push(0x21,0xf9,4,0x01);word(delay).forEach(function(b){bytes.push(b);});bytes.push(0,0);
    bytes.push(0x2c);word(0).forEach(function(b){bytes.push(b);});word(0).forEach(function(b){bytes.push(b);});word(w).forEach(function(b){bytes.push(b);});word(h).forEach(function(b){bytes.push(b);});bytes.push(0);
    var comp=lzwEncode(idx,8);bytes.push(8);
    for(var i=0;i<comp.length;i+=255){var chunk=comp.slice(i,i+255);bytes.push(chunk.length);chunk.forEach(function(b){bytes.push(b);});}
    bytes.push(0);
  });
  bytes.push(0x3b);
  return new Uint8Array(bytes);
}

async function captureCanvasGIF(sourceCanvas,name,variant){
  var size=128,fps=20,duration=4,totalFrames=fps*duration;
  var bgColor=variant==='white-black'?'#0a0a0a':variant==='black-white'?'#ffffff':null;
  var invert=variant==='black-transparent'||variant==='black-white';
  var canvases=[];
  for(var i=0;i<totalFrames;i++){
    await new Promise(function(r){setTimeout(r,1000/fps);});
    var cv=document.createElement('canvas');cv.width=size;cv.height=size;
    var ctx=cv.getContext('2d');
    if(bgColor){ctx.fillStyle=bgColor;ctx.fillRect(0,0,size,size);}
    if(invert){var tmp=document.createElement('canvas');tmp.width=size;tmp.height=size;var tc=tmp.getContext('2d');tc.drawImage(sourceCanvas,0,0,size,size);var id=tc.getImageData(0,0,size,size);for(var j=0;j<id.data.length;j+=4){id.data[j]=255-id.data[j];id.data[j+1]=255-id.data[j+1];id.data[j+2]=255-id.data[j+2];}tc.putImageData(id,0,0);ctx.drawImage(tmp,0,0,size,size);}
    else ctx.drawImage(sourceCanvas,0,0,size,size);
    canvases.push(cv);
  }
  triggerGIFDownload(encodeGIF(canvases,size,size,Math.round(100/fps)),name+'-'+variant+'.gif');
}

async function captureSVGGIF(svgString,name,variant){
  var size=128,fps=20,duration=4,totalFrames=fps*duration;
  var s=applyVariant(svgString,variant);
  var bgColor=variant==='white-black'?'#0a0a0a':variant==='black-white'?'#ffffff':null;
  var blob=new Blob([s],{type:'image/svg+xml'});
  var url=URL.createObjectURL(blob);
  var container=document.createElement('div');
  container.style.cssText='position:fixed;left:-9999px;top:-9999px;width:'+size+'px;height:'+size+'px;';
  document.body.appendChild(container);
  var img=document.createElement('img');img.width=size;img.height=size;img.src=url;container.appendChild(img);
  await new Promise(function(r){img.onload=r;});
  await new Promise(function(r){setTimeout(r,80);});
  var canvases=[];
  for(var i=0;i<totalFrames;i++){
    await new Promise(function(r){setTimeout(r,1000/fps);});
    var cv=document.createElement('canvas');cv.width=size;cv.height=size;
    var ctx=cv.getContext('2d');
    if(bgColor){ctx.fillStyle=bgColor;ctx.fillRect(0,0,size,size);}
    try{ctx.drawImage(img,0,0,size,size);}catch(e){}
    canvases.push(cv);
  }
  document.body.removeChild(container);URL.revokeObjectURL(url);
  triggerGIFDownload(encodeGIF(canvases,size,size,Math.round(100/fps)),name+'-'+variant+'.gif');
}

function triggerGIFDownload(gif,filename){
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([gif],{type:'image/gif'}));a.download=filename;a.click();
}

// ── Canvas spiral animation ──
var TURNS=3.5,STEPS=320;
function bakeWobble(amp){var wx=[],wy=[];for(var i=0;i<=STEPS;i++){var t=i/STEPS;wx.push((Math.random()-0.5)*amp+Math.sin(t*11.3+Math.random()*0.4)*amp*0.5+(Math.random()-0.5)*amp*0.3);wy.push((Math.random()-0.5)*amp*0.65+Math.sin(t*9.7+Math.random()*0.4)*amp*0.35+(Math.random()-0.5)*amp*0.2);}return{wx:wx,wy:wy};}
function makeSpiralLayers(){var w1=bakeWobble(1.3),w2=bakeWobble(1.0),w3=bakeWobble(0.7);return[{opacity:0.92,lw:1.1,lag:0,wx:w1.wx,wy:w1.wy},{opacity:0.48,lw:0.6,lag:0.06,wx:w2.wx,wy:w2.wy},{opacity:0.22,lw:0.32,lag:0.12,wx:w3.wx,wy:w3.wy}];}
function runSpiral(canvas){
  var ctx=canvas.getContext('2d'),W=72,H=72,cx=36,cy=36;
  var rotY=0,rotX=-0.25,time=0,head=0,tail=0,holdTimer=0,phase='drawing',last=null;
  var layers=makeSpiralLayers();
  var speedTable=(function(){var t=[],s=0;for(var i=0;i<=STEPS;i++){var v=i/STEPS,sp=0.72+0.28*v+0.12*Math.sin(v*TURNS*Math.PI*2);t.push(s);s+=sp;}for(var j=0;j<=STEPS;j++)t[j]/=s;return t;})();
  function pIdx(p){var lo=0,hi=STEPS;while(lo<hi){var m=(lo+hi)>>1;if(speedTable[m]<p)lo=m+1;else hi=m;}return lo;}
  function ease(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
  function proj(x,y,z,rX,rY){var x1=x*Math.cos(rY)-z*Math.sin(rY),z1=x*Math.sin(rY)+z*Math.cos(rY),y2=y*Math.cos(rX)-z1*Math.sin(rX),z2=y*Math.sin(rX)+z1*Math.cos(rX),fov=3.8,pz=fov/(fov+z2*0.01);return{sx:x1*1.0*pz,sy:y2*1.0*pz,depth:z2};}
  function frame(ts){
    if(!last)last=ts;var dt=Math.min((ts-last)/1000,0.05);last=ts;time+=dt;
    rotY+=(0.42+0.18*Math.sin(time*0.7)+0.08*Math.sin(time*1.3))*dt;
    rotX=-0.25+0.05*Math.sin(time*0.23)+0.02*Math.sin(time*0.41);
    if(phase==='drawing'){head=Math.min(1,head+dt*0.36);if(head>=1){phase='holding';holdTimer=0;}}
    else if(phase==='holding'){holdTimer+=dt;if(holdTimer>1.4)phase='dissolving';}
    else{tail=Math.min(1,tail+dt*0.28);if(tail>=1){head=0;tail=0;phase='drawing';layers=makeSpiralLayers();}}
    ctx.clearRect(0,0,W,H);
    layers.forEach(function(layer){
      var hN=pIdx(Math.min(0.9999,ease(Math.min(1,Math.max(0,head-layer.lag))))),tN=pIdx(Math.min(0.9999,ease(Math.min(1,Math.max(0,tail-layer.lag*0.5)))));
      if(hN<2)return;
      for(var i=tN;i<hN-1;i++){
        var t0=i/STEPS,t1=(i+1)/STEPS,a0=t0*TURNS*Math.PI*2,r0=t0*12,a1=t1*TURNS*Math.PI*2,r1=t1*12;
        var p0=proj(Math.cos(a0)*r0+layer.wx[i],(1-t0)*22-11+layer.wy[i],Math.sin(a0)*r0,rotX,rotY);
        var p1=proj(Math.cos(a1)*r1+layer.wx[i+1],(1-t1)*22-11+layer.wy[i+1],Math.sin(a1)*r1,rotX,rotY);
        var tE=Math.min(1,(i-tN)/14),hE=Math.min(1,(hN-i)/20),dF=Math.max(0.25,Math.min(1,(p0.depth+18)/36)),tp=(0.7+0.3*Math.sin(t0*Math.PI))*(0.88+Math.random()*0.24);
        ctx.beginPath();ctx.moveTo(cx+p0.sx,cy+p0.sy);ctx.lineTo(cx+p1.sx,cy+p1.sy);
        ctx.strokeStyle='rgba(255,255,255,'+(layer.opacity*dF*tE*hE)+')';ctx.lineWidth=layer.lw*tp;ctx.lineCap='round';ctx.stroke();
      }
    });
    var aF=Math.min(1,head*4)*(tail>0?Math.max(0,1-tail*3):1);
    if(aF>0.02){var ap=proj(0,11,0,rotX,rotY);ctx.beginPath();ctx.arc(cx+ap.sx,cy+ap.sy,1.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+(0.9*aF)+')';ctx.fill();}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

  }else{
    controlsHtml='<div style="max-width:480px;margin-bottom:36px;display:flex;flex-direction:column;gap:10px;">';
    controlsHtml+='<input id="custom-input" placeholder="Describe an icon..." onkeydown="if(event.key===\'Enter\'){var v=this.value.trim();if(v)generate(v);}" style="background:#111;border:1px solid #222;color:#fff;padding:12px 16px;font-family:Arial,sans-serif;font-size:10px;letter-spacing:1px;outline:none;width:100%;"/>';
    controlsHtml+='<button onclick="var v=document.getElementById(\'custom-input\').value.trim();if(v)generate(v);" '+(loading?'disabled':'')+' style="padding:12px 0;width:100%;font-family:Arial,sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;cursor:'+(loading?'not-allowed':'pointer')+';border:1px solid #341C12;color:'+(loading?'#444':'#fff')+';background:#1a0e09;opacity:'+(loading?0.5:1)+';">'+(loading?'Generating...':'Generate')+'</button>';
    controlsHtml+='</div>';
  }

  var gridHtml='';
  if(icons.length>0){
    gridHtml='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;max-width:900px;">';
    icons.forEach(function(icon){
      var fb=feedbackMap[icon.id];
      var border=fb===1?'#2E5038':fb===-1?'#3a1a1a':'#1e1e1e';
      gridHtml+='<div style="background:#111;border:1px solid '+border+';display:flex;flex-direction:column;align-items:center;padding:28px 16px 16px;gap:10px;">';
      gridHtml+='<div style="width:64px;height:64px;">'+icon.svg+'</div>';
      gridHtml+='<p style="font-size:8px;letter-spacing:1.2px;text-transform:uppercase;opacity:0.3;text-align:center;margin:0;">'+icon.prompt+'</p>';
      gridHtml+='<div style="display:flex;gap:6px;width:100%;">';
      gridHtml+='<button onclick="handleFeedback('+icon.id+',1)" style="flex:1;padding:5px 0;font-family:Arial,sans-serif;font-size:11px;cursor:pointer;border:1px solid #222;color:#fff;background:'+(fb===1?'#1E3325':'#0f0f0f')+';">✓</button>';
      gridHtml+='<button onclick="handleFeedback('+icon.id+',-1)" style="flex:1;padding:5px 0;font-family:Arial,sans-serif;font-size:11px;cursor:pointer;border:1px solid #222;color:#fff;background:'+(fb===-1?'#2a1010':'#0f0f0f')+';">✕</button>';
      gridHtml+='</div>';
      gridHtml+='<button id="copy-btn-'+icon.id+'" onclick="handleCopy('+icon.id+')" style="padding:6px 0;width:100%;text-align:center;font-family:Arial,sans-serif;font-size:7px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;border:1px solid #222;color:#fff;background:#151515;">Copy SVG</button>';
      gridHtml+=makeExportDropdown(icon.id,icon.prompt,false);
      gridHtml+='</div>';
    });
    gridHtml+='</div>';
  }else if(!loading){
    gridHtml='<p style="opacity:0.06;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-top:8px;">Press generate.</p>';
  }

  app.innerHTML=
    '<p style="font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:0.4;margin:0 0 4px;">Butterfly Effect</p>'+
    '<p style="font-size:10px;letter-spacing:1px;opacity:0.2;margin:0 0 28px;">Icon Generator — V7.0</p>'+
    '<div id="feedback-meter" style="display:none;align-items:center;gap:12px;margin-bottom:20px;padding:10px 14px;background:#0e0e0e;border:1px solid #1a1a1a;flex-wrap:wrap;"></div>'+
    '<p style="font-size:8px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.2;margin-bottom:10px;">Reference Set</p>'+
    '<div style="display:flex;gap:10px;margin-bottom:36px;flex-wrap:wrap;">'+refCardsHtml+'</div>'+
    modeBtns+controlsHtml+
    '<p id="error-msg" style="color:#c0392b;font-size:10px;letter-spacing:1px;margin-bottom:24px;max-width:480px;"></p>'+
    gridHtml;

  renderMeter();
  var sc=document.getElementById('canvas-spiral-ref');
  if(sc&&!sc._running){sc._running=true;runSpiral(sc);}
}

function setMode(m){mode=m;render();}
render();
</script>
</body>
</html>
